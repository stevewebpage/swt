<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1 – Morning Session | MusicRow.us</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --deep: #0d1f0e; --sun: #ffe566; --gold: #f5c030; --cream: #fefce8;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Lato', sans-serif; background: var(--deep); color: var(--cream); overflow-x: hidden; min-height: 100vh; }

/* 1-2-3 NAV */
.nav-box {
  position: fixed; top: 20px; left: 20px; z-index: 2000;
  display: flex; gap: 15px; background: rgba(13, 31, 14, 0.9);
  padding: 12px 25px; border-radius: 40px; border: 1px solid var(--gold);
}
.nav-box a { color: var(--cream); text-decoration: none; font-weight: 900; font-size: 1.4rem; }
.nav-box a.active { color: var(--gold); text-shadow: 0 0 10px var(--gold); }

/* RESIZED UFO */
.ufo-sky {
  position: fixed; top: 15%; left: 5%; font-size: 3rem; z-index: 500;
  animation: ufoFlight 18s ease-in-out infinite; pointer-events: none;
}
@keyframes ufoFlight {
  0%, 100% { transform: translate(0,0) rotate(0deg); }
  50% { transform: translate(60vw, -20px) rotate(10deg); }
}

/* Original Sun & Animations */
.sun { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); width: 110px; height: 110px; border-radius: 50%; z-index: 2; background: radial-gradient(circle, #ffffff, #ffaa00); box-shadow: 0 0 60px var(--sun); }
.layover-panel { position: relative; width: 90%; max-width: 800px; margin: 150px auto 50px auto; background: rgba(0,0,0,0.75); border: 1px solid var(--gold); padding: 30px; border-radius: 15px; z-index: 10; text-align: center; }
.leaf { position: fixed; top: -20px; z-index: 1; pointer-events: none; animation: fall linear infinite; }
@keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
.bottom-characters { text-align: center; padding: 60px 0; font-size: 3.5rem; z-index: 10; position: relative; }
</style>
</head>
<body>
<div class="nav-box"><a href="index.html" class="active">1</a> <a href="catalog1.html">2</a> <a href="catalog2.html">3</a></div>
<div class="sun"></div>
<div class="ufo-sky">🛸</div>

<div class="layover-panel">
  <h1 style="font-family:'Abril Fatface'; font-size: 3rem; margin-bottom: 20px;">1 – MORNING SESSIONS</h1>
  <p>Your original song players go here.</p>
</div>

<div class="bottom-characters"><div>🤖 👽 👽 👽 🤖</div></div>

<script>
  const leafEmojis=['🍃','🍂','🍁'];
  for(let i=0;i<14;i++){
    const l=document.createElement('div');
    l.className='leaf'; l.textContent=leafEmojis[i%3];
    l.style.cssText=`left:${Math.random()*94}vw;animation-duration:${4+Math.random()*5}s;animation-delay:${Math.random()*7}s;font-size:${10+Math.random()*12}px;`;
    document.body.appendChild(l);
  }
</script>
</body>
</html>
