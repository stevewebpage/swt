<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2 – Golden Hour | MusicRow.us</title>
<style>
:root { --deep: #1a0f1e; --sun: #ff7b00; --gold: #f5c030; --cream: #fefce8; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Lato', sans-serif; background: var(--deep); color: var(--cream); overflow-x: hidden; }

.nav-box {
  position: fixed; top: 20px; left: 20px; z-index: 2000;
  display: flex; gap: 15px; background: rgba(0,0,0,0.8);
  padding: 12px 25px; border-radius: 40px; border: 1px solid var(--gold);
}
.nav-box a { color: #888; text-decoration: none; font-weight: 900; font-size: 1.4rem; }
.nav-box a.active { color: var(--gold); }

.ufo-sky {
  position: fixed; top: 12%; right: 5%; font-size: 3rem; z-index: 500;
  animation: ufoDrift 20s linear infinite;
}
@keyframes ufoDrift { from { transform: translateX(0); } to { transform: translateX(-80vw); } }

.layover-panel { position: relative; width: 90%; max-width: 800px; margin: 150px auto 50px auto; background: rgba(0,0,0,0.7); border: 1px solid var(--gold); padding: 30px; border-radius: 15px; z-index: 10; text-align: center; }
.bottom-characters { text-align: center; padding: 60px 0; font-size: 3.5rem; }
</style>
</head>
<body>
<div class="nav-box"><a href="index.html">1</a> <a href="catalog1.html" class="active">2</a> <a href="catalog2.html">3</a></div>
<div class="ufo-sky">🛸</div>
<div class="layover-panel">
  <h1 style="font-family:'Abril Fatface'; font-size: 3rem; color: var(--gold);">2 – GOLDEN HOUR</h1>
  <p>Secondary session archive.</p>
</div>
<div class="bottom-characters"><div>🤖 👽 👽 👽 🤖</div></div>
</body>
</html>
