<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Steve — MusicRow.US</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Oswald:wght@300;400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-L5C9Q0Q16C"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-L5C9Q0Q16C');
</script>
<style>
:root {
  --ink:    #0d1a08;
  --forest: #1a3d1c;
  --gold:   #f5c030;
  --gold2:  #ffdb6a;
  --cream:  #fefce8;
  --rust:   #8b3a1a;
  --muted:  #4a6741;
  --red:    #9b1c1c;
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }

body {
  font-family: 'Lato', sans-serif;
  background: var(--ink);
  color: var(--cream);
  overflow-x: hidden;
  min-height: 100vh;
}

.bg {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(ellipse at 50% 0%, #2d6128 0%, #1a3d1c 40%, #0d1a08 100%);
}
.bg-overlay {
  position: fixed; inset: 0; z-index: 1;
  background: linear-gradient(180deg, rgba(13,26,8,.3) 0%, rgba(13,26,8,.7) 60%, rgba(13,26,8,.95) 100%);
}

.page {
  position: relative; z-index: 2;
  max-width: 700px;
  margin: 0 auto;
  padding: 40px 20px 60px;
}

.site-link {
  display: block;
  text-align: center;
  font-family: 'Oswald', sans-serif;
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
  margin-bottom: 32px;
  transition: color .2s;
}
.site-link:hover { color: var(--gold); }

.hero-eyebrow {
  text-align: center;
  font-family: 'Oswald', sans-serif;
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 16px;
}

.hero-headline {
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-size: clamp(36px, 8vw, 56px);
  font-weight: 900;
  line-height: 1.05;
  color: var(--cream);
  margin-bottom: 16px;
}
.hero-headline em {
  font-style: italic;
  color: var(--gold);
  display: block;
}

.hero-sub {
  text-align: center;
  font-size: clamp(15px, 3vw, 18px);
  line-height: 1.7;
  color: rgba(254,252,232,.7);
  margin-bottom: 36px;
  font-weight: 300;
  max-width: 520px;
  margin-left: auto;
  margin-right: auto;
}

.divider {
  text-align: center;
  color: var(--gold);
  opacity: .35;
  font-size: 13px;
  letter-spacing: 8px;
  margin: 32px 0;
}

/* ── FORM WRAP ── */
.form-wrap {
  background: rgba(0,0,0,.45);
  border: 1px solid rgba(245,192,48,.2);
  border-radius: 4px;
  padding: 36px 32px 40px;
}

.form-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(22px, 5vw, 32px);
  font-weight: 700;
  color: var(--cream);
  text-align: center;
  margin-bottom: 10px;
}

.form-sub {
  text-align: center;
  font-size: 14px;
  line-height: 1.7;
  color: rgba(254,252,232,.6);
  margin-bottom: 28px;
}

/* ── IFRAME ── */
.form-iframe-wrap {
  border: 1px solid rgba(245,192,48,.15);
  border-radius: 4px;
  overflow: hidden;
  background: rgba(255,255,255,.03);
}

.form-iframe-wrap iframe {
  display: block;
  width: 100%;
  border: none;
}

/* ── CONTACT OPTIONS ── */
.contact-alts {
  margin-top: 32px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: center;
}

.contact-alt-label {
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(254,252,232,.35);
  margin-bottom: 4px;
}

.contact-link {
  display: inline-block;
  font-family: 'Oswald', sans-serif;
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold);
  text-decoration: none;
  border: 1px solid rgba(245,192,48,.3);
  padding: 10px 24px;
  border-radius: 2px;
  transition: background .2s, color .2s;
}
.contact-link:hover {
  background: rgba(245,192,48,.1);
  color: var(--gold2);
}

/* ── FOOTER ── */
.page-footer {
  text-align: center;
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid rgba(245,192,48,.1);
}
.page-footer a {
  font-family: 'Oswald', sans-serif;
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
  transition: color .2s;
}
.page-footer a:hover { color: var(--gold); }

/* ── FADE IN ── */
.fade { animation: fadeUp .8s ease both; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="bg-overlay"></div>

<div class="page">

  <a href="https://musicrow.us" class="site-link">← MusicRow.US — The Forest Sessions</a>

  <div class="fade">
    <p class="hero-eyebrow">Welcome</p>
    <h1 class="hero-headline">This Is The<em>Giveaway Page</em></h1>
    <p class="hero-sub">Just Fill Out This Form!</p>
  </div>

  <div class="divider fade">✦ ✦ ✦</div>

  <div class="form-wrap fade">
    <h2 class="form-title">🎸 Enter The Giveaway</h2>
    <p class="form-sub"></p>

    <div class="form-iframe-wrap">
      <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLScElmTbOI--QFKHLPCGsNHI-HLIa_3y1Yb_kv2yEK8aQ-u_Cg/viewform?embedded=true"
        width="640"
        height="1636"
        frameborder="0"
        marginheight="0"
        marginwidth="0"
        style="width:100%;">
        Loading…
      </iframe>
    </div>

    <div class="contact-alts">
      <p class="contact-alt-label">Or reach out directly</p>
      <a href="mailto:steve@musicrow.us" class="contact-link">✉ steve@musicrow.us</a>
    </div>
  </div>

  <div class="page-footer fade">
    <a href="https://musicrow.us">← Back to MusicRow.US — The Forest Sessions</a>
  </div>

</div>

</body>
</html>
