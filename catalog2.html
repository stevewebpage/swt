<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3 – Midnight Sessions | MusicRow.us</title>
<style>
:root { --deep: #020502; --neon-blue: #00f2ff; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Lato', sans-serif; background: var(--deep); color: #fff; overflow-x: hidden; }

.nav-box {
  position: fixed; top: 20px; left: 20px; z-index: 2000;
  display: flex; gap: 15px; background: rgba(0,0,0,0.95);
  padding: 12px 25px; border-radius: 40px; border: 1px solid var(--neon-blue);
}
.nav-box a { color: #444; text-decoration: none; font-weight: 900; font-size: 1.4rem; }
.nav-box a.active { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }

.ufo-sky {
  position: fixed; top: 10%; left: 50%; font-size: 3rem; z-index: 500;
  animation: ufoGlide 15s linear infinite;
}
@keyframes ufoGlide { from { transform: translateX(-50vw); } to { transform: translateX(50vw); } }

.master-panel { width: 90%; max-width: 900px; margin: 150px auto 40px; padding: 40px; background: rgba(0,242,255,0.05); border: 1px solid var(--neon-blue); border-radius: 20px; text-align: center; }
.bottom-characters { text-align: center; padding: 60px 0; font-size: 3.5rem; }
</style>
</head>
