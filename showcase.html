(function(){
  var el = document.getElementById("ms-flyer");
  var w = 252, h = 76;
  var speed = 0.00018;
  var t = Math.random() * Math.PI * 2;
  var lastTime = null;
  function step(ts) {
    if (!lastTime) lastTime = ts;
    t += speed * (ts - lastTime);
    lastTime = ts;
    var vw = window.innerWidth, vh = window.innerHeight;
    var rx = vw * 0.42, ry = vh * 0.38;
    var cx = vw / 2, cy = vh / 2;
    var x = cx + rx * Math.cos(t) - w / 2;
    var y = cy + ry * Math.sin(t) - h / 2;
    var goingLeft = Math.cos(t - 0.01) > Math.cos(t);
    el.style.transform = goingLeft ? "scaleX(-1)" : "scaleX(1)";
    el.style.left = x + "px";
    el.style.top  = y + "px";
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();

<script>
(function(){
  function positionBeam(){
    var ms = document.querySelector('[style*="bottom:324px"]');
    if(!ms) return;
    var msR = ms.getBoundingClientRect();
    var tipX = msR.left + msR.width / 2;
    var tipY = msR.bottom - 8;
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var botY = vh - 110;
    var halfW = vw * 0.11;
    var cx = vw / 2;
    var ry = 18;
    var leftX = cx - halfW;
    var rightX = cx + halfW;
    var path = 'M '+tipX+','+tipY+
               ' Q '+(tipX - halfW*0.3)+','+((tipY+botY)/2)+' '+leftX+','+(botY-ry)+
               ' A '+halfW+' '+ry+' 0 0 0 '+rightX+','+(botY-ry)+
               ' Q '+(tipX + halfW*0.3)+','+((tipY+botY)/2)+' '+tipX+','+tipY+' Z';
    document.getElementById('beam-path').setAttribute('d', path);
    document.getElementById('beam-funnel').setAttribute('cx', cx);
    document.getElementById('beam-funnel').setAttribute('cy', botY);
    document.getElementById('beam-funnel').setAttribute('rx', halfW);
    document.getElementById('beam-funnel').setAttribute('ry', ry);
  }
  window.addEventListener('resize', positionBeam);
  if(document.readyState === 'complete') { positionBeam(); }
  else { window.addEventListener('load', positionBeam); }
  setTimeout(positionBeam, 300);
})();
</script>

<script>
// ── Tractor beam fires when flyby1 mothership is parked over aliens ──
(function(){
  var CYCLE = 22000; // ms, matches flyby1 animation-duration
  // beam is "on" from 86%–96% of cycle (ship at full size, centered)
  var BEAM_ON  = 0.86;
  var BEAM_OFF = 0.96;

  var beamPath   = document.getElementById('beam-path');
  var beamFunnel = document.getElementById('beam-funnel');
  var beamSvg    = document.getElementById('tractor-beam');
  var flyby1     = document.getElementById('ms-flyby1');

  function updateBeam(ts) {
    var phase = (ts % CYCLE) / CYCLE;
    var active = (phase >= BEAM_ON && phase < BEAM_OFF);

    if (!active) {
      beamPath.setAttribute('d', '');
      beamFunnel.setAttribute('rx', '0');
      requestAnimationFrame(updateBeam);
      return;
    }

    // Fade: ramp in over first 30% of window, ramp out over last 30%
    var window_len = BEAM_OFF - BEAM_ON;
    var within = (phase - BEAM_ON) / window_len;
    var alpha = within < 0.3 ? within/0.3 : within > 0.7 ? (1-within)/0.3 : 1;
    alpha = Math.min(1, Math.max(0, alpha));

    // Ship is centered (translateX(-50%), left:50%) when active
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var tipX = vw / 2;

    // Ship bottom: at peak it's at ~28vh from bottom = 72vh from top
    var tipY = vh * 0.72;
    var botY = vh - 130;
    var halfW = vw * 0.13 * alpha;
    var ry = 20;
    var leftX  = tipX - halfW;
    var rightX = tipX + halfW;

    var path = 'M '+tipX+','+tipY+
               ' Q '+(tipX - halfW*0.3)+','+((tipY+botY)/2)+' '+leftX+','+(botY-ry)+
               ' A '+halfW+' '+ry+' 0 0 0 '+rightX+','+(botY-ry)+
               ' Q '+(tipX + halfW*0.3)+','+((tipY+botY)/2)+' '+tipX+','+tipY+' Z';

    beamPath.setAttribute('d', path);
    beamPath.setAttribute('fill-opacity', (alpha * 0.55).toFixed(2));
    beamFunnel.setAttribute('cx', tipX);
    beamFunnel.setAttribute('cy', botY);
    beamFunnel.setAttribute('rx', halfW);
    beamFunnel.setAttribute('ry', ry);
    beamFunnel.setAttribute('fill-opacity', (alpha * 0.4).toFixed(2));
    beamFunnel.setAttribute('stroke-opacity', (alpha * 0.6).toFixed(2));

    requestAnimationFrame(updateBeam);
  }

  // Sync to the CSS animation start time (it fires immediately on load)
  requestAnimationFrame(updateBeam);
})();
</script>

<div id="night-overlay" style="position:fixed;inset:0;z-index:2;pointer-events:none;background:rgba(0,5,20,0);transition:background 1.5s ease;"></div>
<div id="moon-orb" style="position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:4;pointer-events:none;opacity:0;transition:opacity 1.5s ease;font-size:110px;line-height:110px;width:110px;height:110px;text-align:center;filter:grayscale(100%) brightness(1.1) drop-shadow(0 0 40px rgba(220,220,220,1)) drop-shadow(0 0 100px rgba(180,180,200,0.8)) drop-shadow(0 0 200px rgba(140,150,180,0.5));margin-top:-8px;">🌕</div>
<script>
(function(){
  var sun = document.querySelector('.sun');
  var rays = document.querySelector('.sun-rays');
  var moon = document.getElementById('moon-orb');
  var overlay = document.getElementById('night-overlay');
  var isSun = true;

  // Build star field
  var starContainer = document.createElement('div');
  starContainer.id = 'star-field';
  starContainer.style.cssText = 'position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 1.5s ease;';
  var starHTML = '';
  // Regular stars
  for(var s=0;s<80;s++){
    var x = Math.random()*100, y = Math.random()*55;
    var size = 1.8 + Math.random()*2.8;
    var op = 0.5 + Math.random()*0.5;
    var delay = (Math.random()*4).toFixed(1);
    var dur = (2+Math.random()*3).toFixed(1);
    starHTML += '<div style="position:absolute;left:'+x+'%;top:'+y+'%;width:'+size+'px;height:'+size+'px;border-radius:50%;background:#fff;opacity:'+op+';box-shadow:0 0 '+(size*2)+'px '+(size)+'px rgba(255,255,255,0.4);animation:starTwinkle '+dur+'s ease-in-out '+delay+'s infinite;"></div>';
  }
  // Extra bright standout stars
  var brightStars = [
    [12,8],[28,14],[48,5],[67,11],[83,7],[92,18],[35,22],[58,19],[76,25],[18,30],[44,28]
  ];
  brightStars.forEach(function(p){
    var size = 4 + Math.random()*3;
    var delay = (Math.random()*3).toFixed(1);
    var dur = (1.5+Math.random()*2).toFixed(1);
    starHTML += '<div style="position:absolute;left:'+p[0]+'%;top:'+p[1]+'%;width:'+size+'px;height:'+size+'px;border-radius:50%;background:#fff;opacity:0.95;box-shadow:0 0 '+(size*3)+'px '+(size*1.5)+'px rgba(255,255,255,0.7),0 0 '+(size*6)+'px '+(size*2)+'px rgba(200,220,255,0.35);animation:starTwinkle '+dur+'s ease-in-out '+delay+'s infinite;"></div>';
  });
  starContainer.innerHTML = starHTML;
  document.body.appendChild(starContainer);

  var campfire = document.getElementById('campfire-night');
  function toMoon(){
    isSun = false;
    sun.style.transition = 'opacity 1.5s ease';
    sun.style.opacity = '0';
    if(rays){ rays.style.transition='opacity 1.5s ease'; rays.style.opacity='0'; }
    moon.style.opacity = '1';
    overlay.style.background = 'rgba(0,5,20,0.55)';
    starContainer.style.opacity = '1';
    if(campfire) campfire.style.opacity = '1';
  }
  function toSun(){
    isSun = true;
    sun.style.transition = 'opacity 1.5s ease';
    sun.style.opacity = '1';
    if(rays){ rays.style.transition='opacity 1.5s ease'; rays.style.opacity='1'; }
    moon.style.opacity = '0';
    overlay.style.background = 'rgba(0,5,20,0)';
    starContainer.style.opacity = '0';
    if(campfire) campfire.style.opacity = '0';
  }
  setInterval(function(){
    if(isSun) toMoon(); else toSun();
  }, 15000);
})();
</script>

<script>
(function(){
  var el = document.getElementById("ms-topdrift");
  var w = 200;
  var t = Math.random() * Math.PI * 2;
  var speed = 0.00022;
  var lastTime = null;
  function step(ts){
    if(!lastTime) lastTime = ts;
    t += speed * (ts - lastTime);
    lastTime = ts;
    var vw = window.innerWidth;
    var x = (vw/2) + (vw*0.38)*Math.cos(t) - w/2;
    var goingLeft = Math.cos(t - 0.01) > Math.cos(t);
    el.style.left = x + "px";
    el.style.transform = goingLeft ? "scaleX(-1)" : "scaleX(1)";
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
