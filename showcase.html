<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicRow.us – The Forest Sessions | Steven Bickham</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --deep: #0d1f0e;
  --forest1: #1a3d1c;
  --forest2: #2d6128;
  --forest3: #4a9640;
  --forest4: #6bbf5a;
  --sun: #ffe566;
  --sun2: #ffb030;
  --gold: #f5c030;
  --bark: #7a4a22;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Lato', sans-serif;
  background: var(--deep);
  overflow: hidden;
  height: 100vh; width: 100vw;
}

/* SKY & FOREST */
.sky-bg { position:fixed; inset:0; z-index:0; background:#1a3d1c; }
.forest-photo-bg {
  position:fixed; inset:0; z-index:0;
  background: linear-gradient(180deg,
    #1a4a2a 0%,
    #2d6e3a 15%,
    #1e5230 35%,
    #163d22 60%,
    #0d2a14 80%,
    #071a0c 100%
  );
  filter:brightness(1.08) saturate(1.15);
}
.forest-overlay {
  position:fixed; inset:0; z-index:1;
  background:linear-gradient(180deg,rgba(5,20,8,.12) 0%,rgba(5,20,8,.05) 35%,rgba(5,20,8,.28) 70%,rgba(5,15,5,.82) 100%);
}

/* SUN */
.sun {
  position:fixed; top:18px; left:50%; transform:translateX(-50%);
  width:110px; height:110px; border-radius:50%; z-index:2;
  background:radial-gradient(circle at 38% 32%,#ffffff 0%,#fffde0 12%,#fff5a0 28%,#ffe040 55%,#ffaa00 80%,#ff8800 100%);
  box-shadow:0 0 0 8px rgba(255,248,180,.25),0 0 0 18px rgba(255,230,80,.15),0 0 0 35px rgba(255,210,60,.10),0 0 0 60px rgba(255,180,40,.07),0 0 40px 20px rgba(255,220,80,.55),0 0 90px 50px rgba(255,180,50,.35),0 0 180px 90px rgba(255,150,30,.20),0 0 320px 140px rgba(255,120,20,.10);
  animation:sunPulse 3s ease-in-out infinite;
}
.sun::before {
  content:''; position:absolute; inset:-18px; border-radius:50%;
  background:radial-gradient(circle,transparent 45%,rgba(255,230,80,.18) 55%,rgba(255,200,60,.10) 68%,transparent 80%);
  animation:coronaSpin 18s linear infinite;
}
.sun::after {
  content:''; position:absolute; top:50%; left:-60px; width:230px; height:3px;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,220,.0) 20%,rgba(255,255,200,.55) 48%,rgba(255,255,255,.85) 50%,rgba(255,255,200,.55) 52%,rgba(255,255,220,.0) 80%,transparent 100%);
  transform:translateY(-50%);
  animation:flareFlicker 4s ease-in-out infinite;
}
@keyframes sunPulse {
  0%,100%{box-shadow:0 0 0 8px rgba(255,248,180,.22),0 0 0 18px rgba(255,230,80,.14),0 0 0 35px rgba(255,210,60,.09),0 0 0 60px rgba(255,180,40,.06),0 0 40px 20px rgba(255,220,80,.50),0 0 90px 50px rgba(255,180,50,.30),0 0 180px 90px rgba(255,150,30,.18),0 0 320px 140px rgba(255,120,20,.09);}
  50%{box-shadow:0 0 0 12px rgba(255,248,180,.30),0 0 0 26px rgba(255,230,80,.20),0 0 0 50px rgba(255,210,60,.14),0 0 0 85px rgba(255,180,40,.09),0 0 60px 30px rgba(255,220,80,.65),0 0 130px 70px rgba(255,180,50,.42),0 0 240px 110px rgba(255,150,30,.26),0 0 400px 180px rgba(255,120,20,.14);}
}
@keyframes coronaSpin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@keyframes flareFlicker { 0%,100%{opacity:.4;transform:translateY(-50%) scaleX(1);} 50%{opacity:.9;transform:translateY(-50%) scaleX(1.15);} }

/* RAYS */
.sun-rays { position:fixed; top:-60px; left:50%; transform:translateX(-50%); width:1800px; height:900px; z-index:1; pointer-events:none; }
.ray { position:absolute; top:140px; left:50%; width:60px; height:800px; background:linear-gradient(180deg,rgba(255,240,100,.18) 0%,rgba(255,220,80,.04) 50%,transparent 100%); transform-origin:top center; border-radius:0 0 40px 40px; animation:raySway 3.5s ease-in-out infinite; }
.ray:nth-child(1){transform:rotate(-52deg);animation-delay:0s;width:50px;opacity:.9;}
.ray:nth-child(2){transform:rotate(-42deg);animation-delay:.8s;width:80px;}
.ray:nth-child(3){transform:rotate(-30deg);animation-delay:1.6s;width:65px;}
.ray:nth-child(4){transform:rotate(-18deg);animation-delay:.4s;width:90px;opacity:.8;}
.ray:nth-child(5){transform:rotate(-8deg);animation-delay:2.1s;width:75px;}
.ray:nth-child(6){transform:rotate(0deg);animation-delay:1.0s;width:100px;opacity:.85;}
.ray:nth-child(7){transform:rotate(10deg);animation-delay:.2s;width:70px;}
.ray:nth-child(8){transform:rotate(20deg);animation-delay:1.8s;width:88px;}
.ray:nth-child(9){transform:rotate(32deg);animation-delay:.6s;width:65px;opacity:.9;}
.ray:nth-child(10){transform:rotate(43deg);animation-delay:2.4s;width:78px;}
.ray:nth-child(11){transform:rotate(54deg);animation-delay:1.2s;width:55px;}
@keyframes raySway { 0%,100%{opacity:.6;} 50%{opacity:1;} }

/* CLOUDS */
.cloud { position:fixed; z-index:3; pointer-events:none; border-radius:50px; background:rgba(255,255,255,.75); filter:blur(1px); animation:cloudDrift linear infinite; }
.cloud::before,.cloud::after { content:''; position:absolute; background:inherit; border-radius:50%; }
.cloud:nth-child(1){width:160px;height:45px;top:80px;left:-200px;animation-duration:35s;animation-delay:0s;opacity:.8;}
.cloud:nth-child(2){width:120px;height:35px;top:120px;left:-200px;animation-duration:45s;animation-delay:20s;opacity:.6;}
.cloud:nth-child(3){width:200px;height:55px;top:60px;left:-200px;animation-duration:55s;animation-delay:40s;opacity:.7;}
.cloud:nth-child(1)::before{width:80px;height:70px;top:-35px;left:20px;}
.cloud:nth-child(1)::after{width:60px;height:55px;top:-25px;left:70px;}
.cloud:nth-child(2)::before{width:60px;height:55px;top:-28px;left:15px;}
.cloud:nth-child(2)::after{width:50px;height:45px;top:-20px;left:55px;}
.cloud:nth-child(3)::before{width:100px;height:85px;top:-42px;left:25px;}
.cloud:nth-child(3)::after{width:80px;height:68px;top:-32px;left:90px;}
@keyframes cloudDrift{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 400px))}}

/* TOP UFOS */
.top-ufo { position:fixed; z-index:6; pointer-events:none; }
.top-ufo-saucer { position:relative; display:flex; flex-direction:column; align-items:center; }
.top-ufo-dish {
  position:relative; width:80px; height:20px; border-radius:50%;
  background:radial-gradient(ellipse at 40% 25%, #f0f4f8 0%, #c0d0e0 25%, #7090a8 55%, #405060 85%, #202c38 100%);
  box-shadow:0 3px 14px rgba(0,0,0,0.8),0 0 22px rgba(120,200,255,0.5),0 0 40px rgba(80,160,255,0.2),inset 0 2px 4px rgba(255,255,255,0.55),inset 0 -2px 4px rgba(0,0,0,0.4);
  border-top:1px solid rgba(220,240,255,0.5); border-bottom:1px solid rgba(0,0,0,0.6);
  display:flex; justify-content:space-around; align-items:center; padding:0 6px;
}
.top-ufo-dish::before { content:""; position:absolute; top:3px; left:8px; right:8px; height:3px; border-radius:50%; background:rgba(255,255,255,0.25); filter:blur(1px); }
.top-ufo-dish::after { content:""; position:absolute; bottom:-5px; left:10px; right:10px; height:6px; border-radius:50%; background:radial-gradient(ellipse,rgba(60,80,100,0.9) 0%,rgba(30,40,55,0.6) 60%,transparent 100%); }
.top-ufo-alien { font-size:22px; margin-bottom:-4px; filter:drop-shadow(0 0 8px rgba(120,255,120,0.8)); animation:alienPilot 2s ease-in-out infinite; }
.top-ufo-light { width:6px; height:6px; border-radius:50%; background:rgba(var(--c),1); box-shadow:0 0 4px 3px rgba(var(--c),0.7); animation:ufoFlash .9s ease-in-out infinite; }
@keyframes alienPilot { 0%,100%{transform:translateY(0) rotate(-5deg);} 50%{transform:translateY(-4px) rotate(5deg);} }
#top-ufo-zork { top:55px; left:18%; animation:topUfoFloat 4.2s ease-in-out infinite; }
#top-ufo-xenu { top:70px; right:16%; animation:topUfoFloat 4.8s ease-in-out infinite 1.4s; }
@keyframes topUfoFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
@keyframes topUfoBlip { 0%,100%{transform:scale(1.35) translateY(0);} 50%{transform:scale(1.35) translateY(-10px);} }
@keyframes ufoFlash { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.2;transform:scale(0.6);} }



/* NOTES */
.notes { position:fixed; bottom:240px; left:50%; transform:translateX(-50%); width:460px; z-index:10; pointer-events:none; }
.note { position:absolute; font-size:18px; opacity:0; animation:noteDrift 1.4s ease-out infinite; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
.note:nth-child(1){left:18%;animation-delay:0s;font-size:22px;}
.note:nth-child(2){left:36%;animation-delay:.7s;font-size:16px;}
.note:nth-child(3){left:52%;animation-delay:1.4s;font-size:24px;}
.note:nth-child(4){left:70%;animation-delay:.4s;font-size:14px;}
.note:nth-child(5){left:8%;animation-delay:1.9s;font-size:18px;}
.note:nth-child(6){left:82%;animation-delay:1.1s;font-size:20px;}
@keyframes noteDrift{0%{opacity:0;transform:translateY(0) rotate(0deg);}15%{opacity:1;}85%{opacity:.5;}100%{opacity:0;transform:translateY(-80px) rotate(25deg);}}


/* SPOTLIGHTS */
.spotlight { position:fixed; bottom:0; z-index:9; pointer-events:none; width:180px; height:85vh; border-radius:50% 50% 0 0/20px 20px 0 0; transform-origin:bottom center; mix-blend-mode:screen; animation:spotSway 2s ease-in-out infinite; }
.spotlight-1{left:calc(50% - 160px);background:linear-gradient(180deg,transparent 0%,rgba(255,220,80,.13) 40%,rgba(255,200,60,.22) 100%);animation-delay:0s;}
.spotlight-2{left:50%;transform:translateX(-50%);background:linear-gradient(180deg,transparent 0%,rgba(255,255,180,.15) 40%,rgba(255,240,100,.25) 100%);animation-delay:1.3s;}
.spotlight-3{left:calc(50% + 80px);background:linear-gradient(180deg,transparent 0%,rgba(180,220,255,.13) 40%,rgba(160,200,255,.2) 100%);animation-delay:2.6s;}
@keyframes spotSway{0%,100%{transform:rotate(-6deg);opacity:.8;}50%{transform:rotate(6deg);opacity:1;}}

/* STAGE GLOW */
.stage-glow{position:fixed;z-index:9;pointer-events:none;bottom:192px;left:50%;transform:translateX(-50%);width:420px;height:80px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,240,80,.45) 0%,rgba(255,200,50,.15) 60%,transparent 80%);animation:glowPulse 2s ease-in-out infinite;}
@keyframes glowPulse{0%,100%{width:380px;opacity:.8;}50%{width:460px;opacity:1;}}

/* DISCO BALL */
.disco-mount{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center;}
.disco-conduit{width:6px;height:52px;background:linear-gradient(90deg,#888 0%,#eee 40%,#aaa 60%,#666 100%);border-radius:3px;box-shadow:0 0 4px rgba(0,0,0,.5);}
#discoCanvas{display:block;filter:drop-shadow(0 0 50px rgba(255,255,255,1)) drop-shadow(0 0 90px rgba(200,230,255,1)) drop-shadow(0 0 140px rgba(160,210,255,.9)) drop-shadow(0 0 200px rgba(120,180,255,.6));}
.disco-spot{position:fixed;border-radius:50%;pointer-events:none;z-index:5;mix-blend-mode:normal;opacity:0.18;}

/* FIREFLIES */
.firefly{position:fixed;border-radius:50%;background:radial-gradient(circle,#fffff0 0%,#ffe566 40%,#ffcc00 100%);pointer-events:none;z-index:11;animation:ffFloat ease-in-out infinite;}
@keyframes ffFloat{0%{opacity:0;transform:translate(0,0) scale(0.6);}15%{opacity:1;transform:translate(calc(var(--dx)*.2),calc(var(--dy)*.1)) scale(1.1);}35%{opacity:0.2;transform:translate(calc(var(--dx)*.5),calc(var(--dy)*.4)) scale(0.8);}55%{opacity:1;transform:translate(calc(var(--dx)*.7),calc(var(--dy)*.6)) scale(1.2);}75%{opacity:0.3;transform:translate(calc(var(--dx)*.9),calc(var(--dy)*.8)) scale(0.7);}90%{opacity:0.9;transform:translate(var(--dx),var(--dy)) scale(1.0);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0.5);}}

/* LEAVES */
.leaf{position:fixed;pointer-events:none;z-index:11;font-size:14px;opacity:0;animation:leafFall linear infinite;}
@keyframes leafFall{0%{opacity:0;transform:translateY(-30px) rotate(0deg) translateX(0);}10%{opacity:.8;}90%{opacity:.4;}100%{opacity:0;transform:translateY(105vh) rotate(720deg) translateX(40px);}}

/* HEART */
.heart-bg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:149;pointer-events:none;animation:heartbeat3d 0.43s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(220,40,80,.4)) drop-shadow(0 0 60px rgba(180,20,60,.2));opacity:0.25;}
@keyframes heartbeat3d{0%{transform:translate(-50%,-50%) scale(1) rotateY(0deg);filter:drop-shadow(0 0 20px rgba(220,40,80,.3));}15%{transform:translate(-50%,-50%) scale(1.18) rotateY(8deg);filter:drop-shadow(0 0 50px rgba(220,40,80,.7));}30%{transform:translate(-50%,-50%) scale(1.08) rotateY(4deg);filter:drop-shadow(0 0 30px rgba(220,40,80,.4));}45%{transform:translate(-50%,-50%) scale(1.22) rotateY(-6deg);filter:drop-shadow(0 0 60px rgba(220,40,80,.8));}65%{transform:translate(-50%,-50%) scale(1) rotateY(0deg);filter:drop-shadow(0 0 20px rgba(220,40,80,.3));}100%{transform:translate(-50%,-50%) scale(1) rotateY(0deg);filter:drop-shadow(0 0 20px rgba(220,40,80,.3));}}

/* ROBOTS */
@keyframes robotBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes robotBlink{0%,90%,100%{opacity:1;}95%{opacity:0;}}
@keyframes robotLegL{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}}
@keyframes robotLegR{0%,100%{transform:rotate(8deg);}50%{transform:rotate(-8deg);}}
@keyframes alienSway{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}
@keyframes ufoFloat2{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
@keyframes alienBop{0%,100%{transform:translateY(0);}50%{transform:translateY(-2px);}}
@keyframes mothershipDrift{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-12px);}}

/* PROMO TEXT */
.promo-wrap {
  position:fixed; top:0; left:0; width:100%; height:100%;
  z-index:300; pointer-events:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.promo-title {
  font-family:'Abril Fatface',cursive;
  font-size:clamp(3rem,10vw,7rem);
  color:#fefce0;
  text-shadow:0 0 60px rgba(255,220,70,1),4px 4px 0 rgba(0,0,0,.4),0 0 120px rgba(255,180,50,.6);
  letter-spacing:4px; line-height:1;
  animation:promoFade 12s ease-in-out infinite;
  text-align:center;
}
.promo-sub {
  font-family:'Playfair Display',serif; font-style:italic;
  font-size:clamp(1rem,3vw,2rem);
  color:#88e870;
  text-shadow:0 2px 10px rgba(0,0,0,.8),0 0 30px rgba(100,220,80,.5);
  letter-spacing:6px; margin-top:10px;
  animation:promoFade 12s ease-in-out infinite 0.5s;
  text-align:center;
}
.promo-byline {
  font-family:'Lato',sans-serif; font-weight:300;
  font-size:clamp(.8rem,2vw,1.2rem);
  color:rgba(200,255,180,.75);
  letter-spacing:5px; text-transform:uppercase; margin-top:12px;
  animation:promoFade 12s ease-in-out infinite 1s;
  text-align:center;
}
.promo-divider {
  width:320px; height:2px; margin:20px auto;
  background:linear-gradient(90deg,transparent,#ffe066 30%,#88e870 70%,transparent);
  border-radius:2px;
  animation:promoFade 12s ease-in-out infinite 1.2s;
}
.promo-url {
  font-family:'Abril Fatface',cursive;
  font-size:clamp(3rem,10vw,6rem);
  color:#ffe066;
  text-shadow:0 0 40px rgba(255,220,80,1),0 0 80px rgba(255,180,50,.6), 0 0 120px rgba(255,150,30,.4);
  letter-spacing:4px;
  animation:urlPulse 3s ease-in-out infinite;
  text-align:center; margin-top:8px;
}
.promo-location {
  font-family:'Playfair Display',serif; font-style:italic;
  font-size:clamp(.75rem,1.8vw,1rem);
  color:rgba(160,240,140,.6);
  letter-spacing:4px; margin-top:8px;
  animation:promoFade 12s ease-in-out infinite 1.5s;
  text-align:center;
}
@keyframes promoFade {
  0%{opacity:0;transform:translateY(20px);}
  10%{opacity:1;transform:translateY(0);}
  80%{opacity:1;transform:translateY(0);}
  100%{opacity:0;transform:translateY(-10px);}
}
@keyframes urlPulse {
  0%,100%{opacity:.7;text-shadow:0 0 20px rgba(255,220,80,.6);}
  50%{opacity:1;text-shadow:0 0 40px rgba(255,220,80,1),0 0 80px rgba(255,180,50,.6);}
}
</style>
</head>
<body>

<!-- 3D BEATING HEART -->
<div class="heart-bg">
  <svg viewBox="0 0 200 180" width="420" height="380" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="hg1" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#ff8099"/>
        <stop offset="40%" stop-color="#e0103a"/>
        <stop offset="100%" stop-color="#7a0020"/>
      </radialGradient>
      <radialGradient id="hg2" cx="70%" cy="70%" r="50%">
        <stop offset="0%" stop-color="#ff4466" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#7a0020" stop-opacity="0"/>
      </radialGradient>
      <filter id="hblur"><feGaussianBlur stdDeviation="2.5"/></filter>
    </defs>
    <ellipse cx="100" cy="175" rx="70" ry="8" fill="rgba(0,0,0,0.35)" filter="url(#hblur)"/>
    <path d="M100 155 C60 125, 10 100, 10 60 C10 30, 35 10, 60 10 C75 10, 90 18, 100 30 C110 18, 125 10, 140 10 C165 10, 190 30, 190 60 C190 100, 140 125, 100 155Z" fill="url(#hg1)"/>
    <path d="M100 155 C60 125, 10 100, 10 60 C10 30, 35 10, 60 10 C75 10, 90 18, 100 30 C110 18, 125 10, 140 10 C165 10, 190 30, 190 60 C190 100, 140 125, 100 155Z" fill="url(#hg2)"/>
  </svg>
</div>

<!-- SKY -->
<div class="sky-bg"></div>
<div class="forest-photo-bg"></div>
<div class="forest-overlay"></div>
<div class="sun"></div>
<div class="sun-rays">
  <div class="ray"></div><div class="ray"></div><div class="ray"></div>
  <div class="ray"></div><div class="ray"></div><div class="ray"></div>
  <div class="ray"></div><div class="ray"></div><div class="ray"></div>
  <div class="ray"></div><div class="ray"></div>
</div>

<!-- CLOUDS -->
<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>

<!-- TOP UFOS WITH ALIENS -->
<div id="top-ufo-zork" class="top-ufo">
  <div class="top-ufo-saucer">
    <div class="top-ufo-dish">
      <div class="top-ufo-light" style="--c:255,80,80;"></div>
      <div class="top-ufo-light" style="--c:80,255,120;animation-delay:.2s;"></div>
      <div class="top-ufo-light" style="--c:80,160,255;animation-delay:.4s;"></div>
      <div class="top-ufo-light" style="--c:255,220,80;animation-delay:.6s;"></div>
      <div class="top-ufo-light" style="--c:255,80,255;animation-delay:.8s;"></div>
    </div>
  </div>
</div>

<div id="top-ufo-blip" class="top-ufo" style="top:180px; left:50%; margin-left:-40px; animation:topUfoBlip 3.5s ease-in-out infinite 0.8s;">
  <div class="top-ufo-saucer">
    <div class="top-ufo-dish">
      <div class="top-ufo-light" style="--c:80,255,240;"></div>
      <div class="top-ufo-light" style="--c:255,220,80;animation-delay:.3s;"></div>
      <div class="top-ufo-light" style="--c:255,80,80;animation-delay:.6s;"></div>
      <div class="top-ufo-light" style="--c:80,255,120;animation-delay:.9s;"></div>
      <div class="top-ufo-light" style="--c:220,170,255;animation-delay:1.1s;"></div>
    </div>
  </div>
</div>

<div id="top-ufo-xenu" class="top-ufo" style="top:70px; right:16%;">
  <div class="top-ufo-saucer">
    <div class="top-ufo-dish">
      <div class="top-ufo-light" style="--c:255,210,140;"></div>
      <div class="top-ufo-light" style="--c:160,245,255;animation-delay:.25s;"></div>
      <div class="top-ufo-light" style="--c:255,80,255;animation-delay:.5s;"></div>
      <div class="top-ufo-light" style="--c:80,255,120;animation-delay:.75s;"></div>
      <div class="top-ufo-light" style="--c:255,80,80;animation-delay:1s;"></div>
    </div>
  </div>
</div>

<!-- DRAGGABLE DISCO BALL -->

<script>
// ── Disco ball ──
const C = document.getElementById('discoCanvas');
const ctx = C.getContext('2d');
const lx=-0.6,ly=-0.7,lz=0.5,ll=Math.hypot(-0.6,-0.7,0.5);
const lxn=lx/ll,lyn=ly/ll,lzn=lz/ll;
const ROWS=28,BASE_COLS=40;
let spin=0;
function project(X,Y,Z,R,cx,cy){const sc=0.82;return[cx+X*R*sc,cy+Y*R*sc];}
function drawFrame(a){
  const S=C.width,R=S*0.436,cx=S/2,cy=S/2+S*0.036;
  ctx.clearRect(0,0,S,S);
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();
  const bg=ctx.createRadialGradient(cx-R*.3,cy-R*.38,2,cx,cy,R);
  bg.addColorStop(0,'#ffffff');bg.addColorStop(.3,'#a0b8d0');bg.addColorStop(.7,'#506070');bg.addColorStop(1,'#1a2a3a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,S,S);ctx.restore();
  const faces=[];
  for(let row=0;row<ROWS;row++){
    const phi0=Math.PI*row/ROWS,phi1=Math.PI*(row+1)/ROWS,phiM=(phi0+phi1)/2;
    const cols=Math.max(4,Math.round(BASE_COLS*Math.sin(phiM)));
    for(let col=0;col<cols;col++){
      const t0=2*Math.PI*col/cols+a,t1=2*Math.PI*(col+1)/cols+a,tM=(t0+t1)/2;
      const nx=Math.sin(phiM)*Math.cos(tM),ny=-Math.cos(phiM),nz=Math.sin(phiM)*Math.sin(tM);
      if(nz<0)continue;
      faces.push({row,col,phi0,phi1,t0,t1,tM,nx,ny,nz,depth:nz});
    }
  }
  faces.sort((a,b)=>a.depth-b.depth);
  for(const f of faces){
    const corners4=[[f.phi0,f.t0],[f.phi0,f.t1],[f.phi1,f.t1],[f.phi1,f.t0]].map(([p,t])=>{
      const X=Math.sin(p)*Math.cos(t),Y=-Math.cos(p),Z=Math.sin(p)*Math.sin(t);
      return project(X,Y,Z,R,cx,cy);
    });
    const diff=Math.max(0,f.nx*lxn+f.ny*lyn+f.nz*lzn);
    const hx=(lxn+0)/2,hy=(lyn+0)/2,hz=(lzn+1)/2,hl=Math.hypot(hx,hy,hz);
    const spec=Math.pow(Math.max(0,(f.nx*hx/hl+f.ny*hy/hl+f.nz*hz/hl)),3);
    const base=[255,255,255];
    const br=1.0+diff*1.8+spec*4.0;
    const rr=Math.min(255,base[0]*br+spec*255*0.5)|0;
    const gg=Math.min(255,base[1]*br+spec*255*0.55)|0;
    const bb=Math.min(255,base[2]*br+spec*255*0.7)|0;
    ctx.beginPath();
    ctx.moveTo(corners4[0][0],corners4[0][1]);
    ctx.lineTo(corners4[1][0],corners4[1][1]);
    ctx.lineTo(corners4[2][0],corners4[2][1]);
    ctx.lineTo(corners4[3][0],corners4[3][1]);
    ctx.closePath();
    ctx.fillStyle=`rgb(${rr},${gg},${bb})`;ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=0.5;ctx.stroke();
  }
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();
  const rim=ctx.createRadialGradient(cx,cy,R*0.6,cx,cy,R);
  rim.addColorStop(0,'rgba(0,0,0,0)');rim.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rim;ctx.fillRect(0,0,S,S);ctx.restore();
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();
  const glare=ctx.createRadialGradient(cx-R*.28,cy-R*.32,1,cx-R*.22,cy-R*.25,R*.32);
  glare.addColorStop(0,'rgba(255,255,255,.9)');glare.addColorStop(.4,'rgba(255,255,255,.3)');glare.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=glare;ctx.fillRect(0,0,S,S);ctx.restore();
}

// ── Dot rings ──
const DOT_RINGS=[{r:40,count:16,sz:3.5},{r:90,count:28,sz:3},{r:150,count:40,sz:3},{r:210,count:52,sz:2.5},{r:270,count:64,sz:2.5},{r:330,count:72,sz:2}];
const DOT_TINTS=[[255,255,255],[255,255,255],[255,255,255],[255,255,255],[255,255,255],[255,255,255],[255,255,255],[255,255,255],[255,255,255],[255,255,255],[255,200,180],[180,220,255],[180,255,210],[255,255,160],[220,170,255],[255,210,140],[160,245,255],[255,170,220],[200,255,170],[255,225,140]];
const dots=[];let tintIdx=0;
DOT_RINGS.forEach(ring=>{for(let i=0;i<ring.count;i++){const el=document.createElement('div');const sz=ring.sz+Math.random()*1;const tint=DOT_TINTS[tintIdx++%DOT_TINTS.length];el.style.cssText=`position:fixed;border-radius:50%;pointer-events:none;z-index:5;width:${sz}px;height:${sz}px;background:radial-gradient(circle,rgba(${tint[0]},${tint[1]},${tint[2]},0.95) 0%,rgba(${tint[0]},${tint[1]},${tint[2]},0.3) 55%,transparent 100%);box-shadow:0 0 ${sz*1.5}px ${sz*0.7}px rgba(${tint[0]},${tint[1]},${tint[2]},0.45);will-change:left,top,opacity;`;document.body.appendChild(el);dots.push({el,sz,r:ring.r,baseAngle:(2*Math.PI*i)/ring.count});}});
function updateDots(a){const vw=window.innerWidth,vh=window.innerHeight,STAGE_X=vw/2,STAGE_Y=vh-110;for(const d of dots){const angle=d.baseAngle+a,cosA=Math.cos(angle),sinA=Math.sin(angle);const px=STAGE_X+cosA*d.r,py=STAGE_Y+sinA*(d.r/3);const opacity=0.3+(sinA*0.5+0.5)*0.65;d.el.style.opacity=opacity.toFixed(3);d.el.style.left=(px-d.sz/2).toFixed(1)+'px';d.el.style.top=(py-d.sz/2).toFixed(1)+'px';}}

// ── Glint canvas ──
const LX=-0.55,LY=-0.65,LZ=0.52,LL=Math.hypot(-0.55,-0.65,0.52);
const lx2=LX/LL,ly2=LY/LL,lz2=LZ/LL;
const glintCanvas=document.createElement('canvas');
glintCanvas.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;';
document.body.appendChild(glintCanvas);
const gctx=glintCanvas.getContext('2d');
const G_ROWS=28,G_BASE=40,tiles2=[];
for(let row=0;row<G_ROWS;row++){const phi=Math.PI*(row+0.5)/G_ROWS;const cols=Math.max(4,Math.round(G_BASE*Math.sin(phi)));for(let col=0;col<cols;col++){tiles2.push({phi,tOff:(2*Math.PI*col/cols)});}}
function resizeGlint(){glintCanvas.width=window.innerWidth;glintCanvas.height=window.innerHeight;}resizeGlint();window.addEventListener('resize',resizeGlint);
function getBallCenter(){const canvas=document.getElementById('discoCanvas');const r=canvas.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function updateFlashes(a){const vw=glintCanvas.width,vh=glintCanvas.height;gctx.clearRect(0,0,vw,vh);const bc=getBallCenter();const ballR=document.getElementById('discoCanvas').getBoundingClientRect().width/2;for(const t of tiles2){const phi=t.phi,theta=t.tOff+a;const cosP=Math.cos(phi),sinP=Math.sin(phi),cosT=Math.cos(theta),sinT=Math.sin(theta);const nx=sinP*cosT,ny=-cosP,nz=sinP*sinT;if(nz<0.05)continue;const diff=nx*lx2+ny*ly2+nz*lz2;if(diff<0)continue;const rx=nx-2*diff*lx2,ry=ny-2*diff*ly2,rz=nz-2*diff*lz2;const EZ=1,dot2=rx*0+ry*0+rz*EZ;if(dot2<0.92)continue;const intensity=Math.pow(dot2,60);if(intensity<0.01)continue;const tileX=bc.x+nx*ballR*0.9,tileY=bc.y+ny*ballR*0.9;const projX=bc.x+(tileX-bc.x)*2,projY=bc.y+(tileY-bc.y)*2+vh*0.35;if(projX<-50||projX>vw+50||projY<-50||projY>vh+50)continue;const sz=3+intensity*8;const alpha=Math.min(1,intensity*1.5);gctx.save();gctx.globalAlpha=alpha;const g=gctx.createRadialGradient(projX,projY,0,projX,projY,sz*3);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.3,'rgba(220,240,255,0.8)');g.addColorStop(1,'rgba(180,210,255,0)');gctx.fillStyle=g;gctx.beginPath();gctx.arc(projX,projY,sz*3,0,Math.PI*2);gctx.fill();gctx.restore();}}

// ── Firefly sparkles ──
const fireflyCanvas=document.createElement('canvas');
fireflyCanvas.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:49;';
document.body.appendChild(fireflyCanvas);
const fctx=fireflyCanvas.getContext('2d');
function resizeFirefly(){fireflyCanvas.width=window.innerWidth;fireflyCanvas.height=window.innerHeight;}resizeFirefly();window.addEventListener('resize',resizeFirefly);
const NUM_FLIES=40;
const flies=Array.from({length:NUM_FLIES},()=>({angle:Math.random()*Math.PI*2,radius:30+Math.random()*70,speed:(Math.random()>.5?1:-1)*(0.006+Math.random()*0.014),phase:Math.random()*Math.PI*2,flashRate:0.12+Math.random()*0.32,burstPhase:Math.random()*Math.PI*2,burstRate:0.04+Math.random()*0.09,size:1.2+Math.random()*2.8,drift:(Math.random()-0.5)*0.003,hue:[[255,255,255],[200,230,255],[255,245,180],[180,255,220],[255,210,255]][Math.floor(Math.random()*5)]}));
function updateFireflies(){fctx.clearRect(0,0,fireflyCanvas.width,fireflyCanvas.height);const bc=getBallCenter();flies.forEach(f=>{f.angle+=f.speed;f.radius+=f.drift;if(f.radius<28)f.drift=Math.abs(f.drift);if(f.radius>95)f.drift=-Math.abs(f.drift);f.phase+=f.flashRate;f.burstPhase+=f.burstRate;const flicker=Math.max(0,Math.sin(f.phase));const bloom=0.3+0.7*Math.max(0,Math.sin(f.burstPhase));const alpha=flicker*bloom;if(alpha<0.02)return;const x=bc.x+Math.cos(f.angle)*f.radius,y=bc.y+Math.sin(f.angle)*f.radius*0.52;const[r,g,b]=f.hue;const core=f.size*(1+bloom*0.6),glow=core*5;fctx.save();fctx.globalAlpha=alpha;const grad=fctx.createRadialGradient(x,y,0,x,y,glow);grad.addColorStop(0,`rgba(${r},${g},${b},1)`);grad.addColorStop(0.15,`rgba(${r},${g},${b},0.8)`);grad.addColorStop(0.4,`rgba(${r},${g},${b},0.25)`);grad.addColorStop(1,`rgba(${r},${g},${b},0)`);fctx.fillStyle=grad;fctx.beginPath();fctx.arc(x,y,glow,0,Math.PI*2);fctx.fill();fctx.globalAlpha=Math.min(1,alpha*1.8);fctx.fillStyle=`rgba(${r},${g},${b},1)`;fctx.beginPath();fctx.arc(x,y,core,0,Math.PI*2);fctx.fill();if(flicker>0.7&&bloom>0.6){fctx.globalAlpha=(flicker-0.7)*2.5*bloom;fctx.strokeStyle=`rgba(${r},${g},${b},1)`;fctx.lineWidth=0.7;const arm=core*3.5;fctx.beginPath();fctx.moveTo(x-arm,y);fctx.lineTo(x+arm,y);fctx.moveTo(x,y-arm);fctx.lineTo(x,y+arm);fctx.stroke();}fctx.restore();});}

// ── Main loop ──
const SPEED=0.009;
function loop(){spin+=SPEED;drawFrame(spin);updateDots(spin);updateFireflies();updateFlashes(spin);requestAnimationFrame(loop);}
loop();

// ── Fireflies ──
for(let i=0;i<45;i++){const f=document.createElement('div');f.className='firefly';const size=3+Math.random()*6;const warm=Math.random()>.5;const glowColor=warm?'rgba(255,240,80,.8)':'rgba(180,255,120,.7)';f.style.cssText=`left:${Math.random()*98}vw;top:${5+Math.random()*80}vh;--dx:${(Math.random()-.5)*160}px;--dy:${(Math.random()-.5)*120}px;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*6}s;width:${size}px;height:${size}px;box-shadow:0 0 ${size*2}px ${size}px ${glowColor},0 0 ${size*4}px ${size*1.5}px ${glowColor.replace('.8','.3').replace('.7','.25')};`;document.body.appendChild(f);}


</script>
